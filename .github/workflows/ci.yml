name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  docker:
    name: Build and smoke-test container image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t campus-lost-found:${{ github.sha }} .
      - name: Run container and check health endpoint
        run: |
          docker run -d --name lf -p 3000:3000 -e JWT_SECRET=ci-secret-ci-secret-ci-secret-1234 campus-lost-found:${{ github.sha }}
          for i in $(seq 1 20); do curl -fs http://localhost:3000/api/health && exit 0; sleep 2; done
          docker logs lf; exit 1

  publish:
    name: Push image to GitHub Container Registry
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
