# Demo values only. In a real cluster create this with:
#   kubectl create secret generic lostfound-secrets --from-literal=JWT_SECRET=$(openssl rand -hex 32) ...
apiVersion: v1
kind: Secret
metadata:
  name: lostfound-secrets
type: Opaque
stringData:
  JWT_SECRET: "replace-with-a-long-random-string-before-deploying"
  ADMIN_PASSWORD: "Admin@123"
  OFFICER_PASSWORD: "Officer@123"
